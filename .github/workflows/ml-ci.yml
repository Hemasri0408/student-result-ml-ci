
name: Student Result ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run ML pipeline tests
        run: python -m unittest test_ml_pipeline -v

      - name: Run prediction API tests
        run: python -m unittest test_app -v

      - name: Prepare release candidate
        run: |
          mkdir -p release
          cp app.py release/
          cp student_result_model.pkl release/
          cp metrics.json release/
          cp requirements.txt release/
          cp DEPLOYMENT.txt release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release/
          if-no-files-found: error
          retention-days: 7
